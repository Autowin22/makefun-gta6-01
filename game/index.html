<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Run: Port Solano</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #11141b; font-family: system-ui, -apple-system, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  noscript { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #eef1f5; text-align: center; }
</style>
</head>
<body>
<canvas id="game" aria-label="Night Run: Port Solano: top-down open-world crime and driving action game"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript>Night Run: Port Solano requires JavaScript enabled to run.</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
